locator:
  enabled: true

  # Maximum distance in blocks for detecting players.
  range: 128

  # How often the locator updates.
  # 20 ticks = approximately 1 second.
  update-interval-ticks: 10

  # Maximum number of players shown.
  max-players: 20

security:
  # Permission required to use the locator.
  require-permission: true

  permission: gamerxdgzlocator.use

  # Do not show players marked as vanished.
  respect-vanish: true

performance:
  # Only detect players in the same world.
  same-world-only: true

locator:
  enabled: true

  # Maximum detection distance.
  range: 128

  # Update interval in server ticks.
  update-interval-ticks: 10

  # Maximum players displayed per viewer.
  max-players: 20

security:
  require-permission: true

  permission: gamerxdgzlocator.use

  respect-vanish: true

performance:
  same-world-only: true

  # Prevent excessively large detection ranges.
  maximum-range: 256

  # Prevent excessively fast updates.
  minimum-update-interval-ticks: 5
